{% extends "inicio/encabezado.html" %} {% block titulo %}Form Editar
Comentario{% endblock %} {% block encabezado_pagina %}
<div class="page-header">
  <div class="page-title">
    <h3>
      FormEditar Comentario
      <small>Modificar comentario</small>
    </h3>
  </div>
</div>
{% endblock %} {% block contenido %}
<div class="panel panel-default">
  <div class="panel-body">
    <form
      class="form-horizontal"
      action="{% url 'Editar' comentario.id %}"
      method="POST"
      role="form"
    >
      {% csrf_token %}
      <div class="form-group">
        <label>Nombre:</label>
        <input
          value="{{ comentario.usuario }}"
          name="usuario"
          type="text"
          class="formcontrol"
        />
      </div>
      <div class="form-group">
        <label>Mensaje:</label>
        <textarea name="mensaje" cols="50" rows="10" class="formcontrol">{{ comentario.mensaje }}</textarea>
      </div>
      <button type="submit">Guardar Cambios</button>
    </form>
  </div>
</div>
{% endblock %}
